[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqreg"
version = "0.1.0"
description = "Sequence-regression utilities for thermal-fluid experimental data."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "Pillow",
  "scikit-learn",
  "tensorflow",
]

[tool.setuptools.packages.find]
include = ["seqreg*"]
